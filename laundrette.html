        function drawTopDownMachine(m) {
            const isW = m.type === 'washer';
            const bodyCol = isW ? PALETTE.washerBody : PALETTE.dryerBody;
            const topCol = isW ? PALETTE.washerTop : PALETTE.dryerTop;
            const shadeCol = isW ? PALETTE.washerShade : PALETTE.dryerShade;
            const accentCol = isW ? PALETTE.washerAccent : PALETTE.dryerAccent;
            const drumCol = isW ? PALETTE.washerDrum : PALETTE.dryerDrum;

            const near = getNearbyTopDownInteractable();
            const highlighted = state.hoverTarget === m.id || state.selectedTarget === m.id || (near && near.type === 'machine' && near.machine.id === m.id);

            fillRoundRect(m.x + 3, m.y + 5, m.w, m.h, 9, 'rgba(49, 64, 59, 0.14)');
            if (highlighted) fillRoundRect(m.x - 5, m.y - 5, m.w + 10, m.h + 10, 12, PALETTE.highlightGlow);

            fillRoundRect(m.x, m.y, m.w, m.h, 8, bodyCol, PALETTE.ink, 2.4);
            fillRoundRect(m.x + 2, m.y + 2, m.w - 4, 24, 6, topCol);

            ctx.fillStyle = shadeCol;
            ctx.fillRect(m.x + 2, m.y + 26, m.w - 4, 16);
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(m.x + 1, m.y + 26); ctx.lineTo(m.x + m.w - 1, m.y + 26);
            ctx.moveTo(m.x + 1, m.y + 42); ctx.lineTo(m.x + m.w - 1, m.y + 42);
            ctx.stroke();

            if (isW) {
                ctx.fillStyle = PALETTE.cream;
                ctx.fillRect(m.x + 9, m.y + 30, 26, 8);
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 1.2;
                ctx.strokeRect(m.x + 9, m.y + 30, 26, 8);
            } else {
                ctx.fillStyle = accentCol;
                ctx.fillRect(m.x + 10, m.y + 31, 22, 2.5);
                ctx.fillRect(m.x + 10, m.y + 35.5, 22, 2.5);
            }

            let ledCol = '#b8c7c1';
            if (m.state === 'loading') ledCol = '#efc264';
            else if (m.state === 'running') ledCol = isW ? '#6ab8f0' : '#f0a25e';
            else if (m.state === 'done') ledCol = '#58c488';

            ctx.fillStyle = ledCol;
            ctx.beginPath(); ctx.arc(m.x + m.w - 34, m.y + 34, 4, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 1.2; ctx.stroke();

            ctx.fillStyle = PALETTE.cream;
            ctx.beginPath(); ctx.arc(m.x + m.w - 16, m.y + 34, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            const cx = m.x + m.w / 2, cy = m.y + 82;
            ctx.fillStyle = PALETTE.cream;
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.arc(cx, cy, 31, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = drumCol;
            ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2); ctx.fill();

            ctx.save();
            ctx.beginPath(); ctx.arc(cx, cy, 21, 0, Math.PI * 2); ctx.clip();

            if (m.items.length > 0) {
                ctx.save();
                ctx.translate(cx, cy);
                if (m.state === 'running') ctx.rotate(m.spinAngle);
                for (let k = 0; k < m.items.length; k++) {
                    const a = (k * Math.PI * 2) / Math.max(1, m.items.length);
                    ctx.fillStyle = m.items[k].fill || '#fae08c';
                    ctx.beginPath(); ctx.arc(Math.cos(a) * 8, Math.sin(a) * 8, 6.8, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }

            if (m.state === 'running') {
                if (isW) {
                    ctx.fillStyle = 'rgba(130, 198, 240, 0.42)';
                    ctx.fillRect(cx - 22, cy - 2, 44, 24);
                    for (let b = 0; b < 4; b++) {
                        const bx = cx - 12 + b * 8;
                        const by = cy + 12 - ((state.time * 22 + b * 9) % 24);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
                        ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill();
                    }
                } else {
                    const glow = 0.22 + Math.sin(state.time * 6) * 0.1;
                    ctx.fillStyle = `rgba(255, 210, 130, ${glow})`;
                    ctx.fillRect(cx - 22, cy - 22, 44, 44);
                    drawSparkle(cx - 8, cy - 7 + Math.sin(state.time * 5) * 4, 5, '#fff6c4');
                    drawSparkle(cx + 9, cy + 6 + Math.cos(state.time * 4) * 4, 4.5, '#ffe699');
                }
            }
            ctx.restore();

            ctx.strokeStyle = accentCol;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2); ctx.stroke();

            ctx.fillStyle = accentCol;
            ctx.fillRect(cx + 23, cy - 8, 5, 16);

            ctx.fillStyle = PALETTE.ink;
            ctx.font = '900 12px "Trebuchet MS", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(isW ? 'WASHER' : 'DRYER', m.x + 8, m.y + 15);

            const badgeSize = 26;
            const bx = m.x + m.w - badgeSize - 4;
            const by = m.y - 4;
            fillRoundRect(bx, by, badgeSize, badgeSize, 7, accentCol, PALETTE.ink, 2);
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 16px "Trebuchet MS", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(String(m.number), bx + badgeSize / 2, by + badgeSize / 2 + 1);

            if (m.state === 'running') {
                const barX = m.x + 12, barY = m.y + m.h - 14, barW = m.w - 24;
                fillRoundRect(barX, barY, barW, 10, 5, PALETTE.cream, PALETTE.ink, 1.6);
                fillRoundRect(barX + 2, barY + 2, Math.max(6, (barW - 4) * m.progress), 6, 3, isW ? '#6ab8f0' : '#f0a25e');
            }

            if (m.state === 'done') {
                const bob = Math.sin(state.time * 4.2) * 2.5;
                const badgeW = 78, badgeH = 24;
                const rx = m.x + (m.w - badgeW) / 2, ry = m.y - 14 + bob;
                fillRoundRect(rx, ry, badgeW, badgeH, 12, PALETTE.greenSoft, PALETTE.ink, 2);
                ctx.fillStyle = PALETTE.ink;
                ctx.font = '900 12px "Trebuchet MS", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('✓ READY', rx + badgeW / 2, ry + badgeH / 2 + 1);
            }
        }

        function drawMiniCarriedBasket(cx, cy, basketType = 'dirty', scale = 1.0) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);

            ctx.fillStyle = basketType === 'dirty' ? '#e5c678' : (basketType === 'wet' ? '#95c9f0' : '#fae08c');
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(-5, -6, 6, 0, Math.PI * 2);
            ctx.arc(5, -6, 6, 0, Math.PI * 2);
            ctx.arc(0, -9, 6, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = PALETTE.basketMain;
            ctx.beginPath();
            ctx.moveTo(-14, -5); ctx.lineTo(14, -5); ctx.lineTo(11, 9); ctx.lineTo(-11, 9); ctx.closePath();
            ctx.fill(); ctx.stroke();

            fillRoundRect(-15, -7, 30, 4, 2, PALETTE.basketLight, PALETTE.ink, 1.4);
            if (basketType === 'clean') drawSparkle(0, -14, 5, '#fffdf0');
            ctx.restore();

        function drawPatrick() {
            const px = Math.round(patrick.x);
            const py = Math.round(patrick.y);
            const bob = patrick.isMoving ? (patrick.walkFrame === 0 ? -2 : 1) : Math.sin(state.time * 3.2) * 1.4;

            ctx.beginPath(); ctx.ellipse(px, py + 4, 16, 7, 0, 0, Math.PI * 2); ctx.fill();

            ctx.save();
            ctx.translate(px, py + bob);

            if (state.basket && patrick.dir === 'up') drawMiniCarriedBasket(0, -24, state.basket.type);

            const isSide = patrick.dir === 'left' || patrick.dir === 'right';
            const lFootY = isSide ? 0 : (stride > 0 ? -3 : 0);
            const rFootY = isSide ? 0 : (stride < 0 ? -3 : 0);

            ctx.lineWidth = 2;
            ctx.fillRect(lFootX, -12 + lFootY, 7, 11); ctx.strokeRect(lFootX, -12 + lFootY, 7, 11);
            ctx.fillRect(rFootX, -12 + rFootY, 7, 11); ctx.strokeRect(rFootX, -12 + rFootY, 7, 11);

            ctx.fillStyle = PALETTE.shoes;

            fillRoundRect(-13, -29, 26, 19, 6, PALETTE.shirt, PALETTE.ink, 2.2);
            ctx.fillStyle = PALETTE.cream;
            ctx.fillRect(-4, -27, 8, 3);

            const armSwing = patrick.isMoving ? (patrick.walkFrame === 0 ? 3 : -3) : 0;
            if (!isSide) {
                fillRoundRect(-17, -27 + (state.basket ? -2 : armSwing), 5, 13, 2, PALETTE.shirt, PALETTE.ink, 1.8);
                fillRoundRect(12, -27 + (state.basket ? -2 : -armSwing), 5, 13, 2, PALETTE.shirt, PALETTE.ink, 1.8);
            } else {
                fillRoundRect(-4 + (state.basket ? 3 : armSwing), -26, 8, 12, 3, PALETTE.shirt, PALETTE.ink, 1.8);

            fillRoundRect(-14, -52, 28, 25, 8, PALETTE.skin, PALETTE.ink, 2.2);

            if (patrick.dir === 'up') {
                fillRoundRect(-15, -55, 30, 22, 8, PALETTE.hair, PALETTE.ink, 2.2);

                ctx.fillRect(-8, -49, 16, 4);
            } else if (patrick.dir === 'down') {
                fillRoundRect(-15, -56, 30, 12, 6, PALETTE.hair, PALETTE.ink, 2.2);

                ctx.fillRect(-14, -47, 5, 7); ctx.fillRect(9, -47, 5, 7); ctx.fillRect(-4, -46, 8, 4);
                ctx.fillStyle = PALETTE.hairLight;
                ctx.fillRect(-8, -53, 14, 3);

                ctx.fillStyle = PALETTE.ink;
                ctx.fillRect(-7, -41, 3.5, 4.5); ctx.fillRect(3.5, -41, 3.5, 4.5);
                ctx.fillStyle = 'rgba(232, 148, 134, 0.45)';
                ctx.fillRect(-11, -36, 4, 2.8); ctx.fillRect(7, -36, 4, 2.8);

                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 1.8;
                ctx.beginPath(); ctx.arc(0, -35, 4, 0.2, Math.PI - 0.2); ctx.stroke();
            } else {
                const flip = patrick.dir === 'left' ? -1 : 1;
                ctx.save();
                ctx.scale(flip, 1);
                fillRoundRect(-15, -56, 29, 12, 6, PALETTE.hair, PALETTE.ink, 2.2);
                ctx.fillStyle = PALETTE.hair; ctx.fillRect(-15, -47, 11, 14);
                ctx.fillStyle = PALETTE.hairLight; ctx.fillRect(-8, -53, 12, 3);
                ctx.fillStyle = PALETTE.ink; ctx.fillRect(4, -41, 3.5, 4.5);
                ctx.fillStyle = 'rgba(232, 148, 134, 0.45)'; ctx.fillRect(7, -36, 3.5, 2.5);
                ctx.restore();
            }

            if (state.basket && patrick.dir !== 'up') {
                const bx = patrick.dir === 'left' ? -18 : (patrick.dir === 'right' ? 18 : 0);
                const by = patrick.dir === 'down' ? -14 : -17;
                drawMiniCarriedBasket(bx, by, state.basket.type);

            ctx.restore();

        function drawCustomer(c) {
            const style = CUSTOMER_STYLES[c.styleIdx % CUSTOMER_STYLES.length];
            const cx = Math.round(c.x);
            const cy = Math.round(c.y);
            const isMoving = c.waypoints.length > 0;
            const bob = isMoving ? (c.walkFrame === 0 ? -2 : 1) : Math.sin(state.time * 2.8 + c.id) * 1.2;
            const stride = isMoving ? (c.walkFrame === 0 ? -3.5 : 3.5) : 0;

            ctx.fillStyle = 'rgba(49, 64, 59, 0.2)';
            ctx.beginPath(); ctx.ellipse(cx, cy + 4, 15, 6.5, 0, 0, Math.PI * 2); ctx.fill();

            ctx.save();
            ctx.translate(cx, cy + bob);

            if (c.carrying && c.dir === 'up') {
                drawMiniCarriedBasket(0, -24, c.carrying, 0.96);
            }

            const isSide = c.dir === 'left' || c.dir === 'right';
            const lFootY = isSide ? 0 : (stride > 0 ? -3 : 0);
            const rFootY = isSide ? 0 : (stride < 0 ? -3 : 0);
            const lFootX = isSide ? -5 + stride : -8;
            const rFootX = isSide ? 1 - stride : 1;

            ctx.fillStyle = style.trousers;
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 2;
            ctx.fillRect(lFootX, -12 + lFootY, 7, 11); ctx.strokeRect(lFootX, -12 + lFootY, 7, 11);
            ctx.fillRect(rFootX, -12 + rFootY, 7, 11); ctx.strokeRect(rFootX, -12 + rFootY, 7, 11);

            ctx.fillStyle = PALETTE.shoes;
            ctx.fillRect(lFootX - 1, -3 + lFootY, 9, 5);
            ctx.fillRect(rFootX - 1, -3 + rFootY, 9, 5);

            fillRoundRect(-12, -29, 24, 19, 6, style.shirt, PALETTE.ink, 2.1);

            const armSwing = isMoving ? (c.walkFrame === 0 ? 3 : -3) : 0;
            if (!isSide) {
                fillRoundRect(-16, -27 + (c.carrying ? -2 : armSwing), 5, 13, 2, style.shirt, PALETTE.ink, 1.8);
                fillRoundRect(11, -27 + (c.carrying ? -2 : -armSwing), 5, 13, 2, style.shirt, PALETTE.ink, 1.8);
            } else {
                fillRoundRect(-4 + (c.carrying ? 3 : armSwing), -26, 8, 12, 3, style.shirt, PALETTE.ink, 1.8);
            }

            fillRoundRect(-13, -51, 26, 24, 8, style.skin, PALETTE.ink, 2.1);

            if (c.dir === 'up') {
                fillRoundRect(-14, -54, 28, 21, 8, style.hair, PALETTE.ink, 2.1);
            } else if (c.dir === 'down') {
                fillRoundRect(-14, -55, 28, 12, 6, style.hair, PALETTE.ink, 2.1);
                ctx.fillStyle = style.hair;
                ctx.fillRect(-13, -46, 4, 8); ctx.fillRect(9, -46, 4, 8);
                ctx.fillStyle = PALETTE.ink;
                ctx.fillRect(-6.5, -41, 3.2, 4.2); ctx.fillRect(3.3, -41, 3.2, 4.2);
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 1.6;
                ctx.beginPath(); ctx.arc(0, -35, 3.6, 0.2, Math.PI - 0.2); ctx.stroke();
            } else {
                const flip = c.dir === 'left' ? -1 : 1;
                ctx.save();
                ctx.scale(flip, 1);
                fillRoundRect(-14, -55, 27, 12, 6, style.hair, PALETTE.ink, 2.1);
                ctx.fillStyle = style.hair; ctx.fillRect(-14, -46, 10, 13);
                ctx.fillStyle = PALETTE.ink; ctx.fillRect(3.5, -41, 3.2, 4.2);
                ctx.restore();
            }

            if (c.carrying && c.dir !== 'up') {
                const bx = c.dir === 'left' ? -18 : (c.dir === 'right' ? 18 : 0);
                const by = c.dir === 'down' ? -14 : -17;
                drawMiniCarriedBasket(bx, by, c.carrying, 0.96);
            }

            // Calm thought bubble showing a clean folded shirt while patiently waiting
            if (c.role === 'pickup' && c.phase === 'waiting') {
                const floatY = -74 + Math.sin(state.time * 3.2 + c.id) * 2.5;
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(2, floatY + 20, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(7, floatY + 14, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                fillRoundRect(-10, floatY - 14, 38, 28, 12, '#ffffff', PALETTE.ink, 2);

                // Clean folded shirt icon inside bubble
                fillRoundRect(-2, floatY - 7, 22, 14, 4, '#98ccb0', PALETTE.ink, 1.6);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(5, floatY - 7); ctx.lineTo(9, floatY - 2); ctx.lineTo(13, floatY - 7);
                ctx.closePath();
                ctx.fill();
                drawSparkle(21, floatY - 9, 4.5, '#fae08c');
            } else if (c.phase === 'celebrating') {
                drawHeart(0, -68 - (0.7 - c.pauseTimer) * 16, 11, '#f2a8c4', 1);

            ctx.restore();

        function drawTopDownBanner() {
            if (!state.banner) return;
            const b = state.banner;
            let alpha = 1;
            if (b.timer > b.maxTimer - 0.6) alpha = Math.max(0, (b.maxTimer - b.timer) / 0.6);

            ctx.save();
            ctx.globalAlpha = alpha;
            const w = 640, h = 46, x = 230, y = 268;
            fillRoundRect(x + 3, y + 4, w, h, 14, 'rgba(37, 48, 54, 0.2)');
            fillRoundRect(x, y, w, h, 14, PALETTE.cream, PALETTE.ink, 2.6);
            fillRoundRect(x + 5, y + 5, w - 10, h - 10, 10, null, PALETTE.wallBanner, 1.5);

            ctx.fillStyle = PALETTE.ink;
            ctx.font = '900 16px "Trebuchet MS", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.text, x + w / 2, y + h / 2 + 1);
            ctx.restore();
        }

        function drawTopDownScene() {
            drawTopDownRoom();
            for (const m of MACHINES) if (m.type === 'washer') drawTopDownMachine(m);

            const drawables = [
                { y: DESK.y + DESK.h - 20, fn: drawReceptionDesk },
                { y: POPEYE_SPOT.cy + 16, fn: drawTopDownPopeye },
                { y: patrick.y, fn: drawPatrick }
            ];
            for (const c of state.customers) {
                drawables.push({ y: c.y, fn: () => drawCustomer(c) });
            }
            drawables.sort((a, b) => a.y - b.y);
            for (const d of drawables) d.fn();

            for (const m of MACHINES) if (m.type === 'dryer') drawTopDownMachine(m);
            drawTopDownBanner();
        }

        /* =========================================================================

        function drawPopeyeCloseUpScene() {
            const p = state.popeye;
            const isHappy = p.rubEnergy > 0.08;

            ctx.fillStyle = PALETTE.wallCream;
            ctx.fillRect(0, 62, LOGICAL_W, 338);

        function drawBottleSprite(cx, cy, isSoftener, rotation = 0, scale = 1.0) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            ctx.scale(scale, scale);

            const mainCol = isSoftener ? '#f4b5cb' : '#8cc5ec';
            const capCol = isSoftener ? '#d47c9d' : '#5697cc';

            fillRoundRect(-11, -44, 22, 12, 4, capCol, PALETTE.ink, 2);

            if (!isSoftener) {
                fillRoundRect(-24, -32, 48, 64, 10, mainCol, PALETTE.ink, 2.4);
                fillRoundRect(9, -20, 9, 20, 4, PALETTE.cream, PALETTE.ink, 2);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(-6, 2, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = mainCol;
                ctx.beginPath(); ctx.arc(-9, 0, 3.8, 0, Math.PI * 2); ctx.arc(-2, 5, 2.8, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = mainCol;
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(-15, -32); ctx.lineTo(15, -32);
                ctx.quadraticCurveTo(26, -8, 23, 28);
                ctx.quadraticCurveTo(0, 35, -23, 28);
                ctx.quadraticCurveTo(-26, -8, -15, -32);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                ctx.fillStyle = '#ffffff';
                for (let k = 0; k < 5; k++) {
                    const a = (k * Math.PI * 2) / 5;
                    ctx.beginPath(); ctx.arc(Math.cos(a) * 6.5, 3 + Math.sin(a) * 6.5, 4.5, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = '#fae08c';
                ctx.beginPath(); ctx.arc(0, 3, 4.2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function drawActivePourAnimation(p) {
            const t = p.timer / p.duration;
            const streamAlpha = t < 0.85 ? 1 : (1 - t) / 0.15;

            ctx.save();
            ctx.globalAlpha = streamAlpha;
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 9;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p.x - 16, p.y - 8);
            ctx.quadraticCurveTo(p.targetX + 4, p.y + 18, p.targetX, p.targetY);
            ctx.stroke();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(p.x - 17, p.y - 6);
            ctx.quadraticCurveTo(p.targetX + 2, p.y + 18, p.targetX - 1, p.targetY - 2);
            ctx.stroke();
            ctx.restore();

            for (const d of p.drops) {
                ctx.save();
                ctx.globalAlpha = 1 - d.life / d.maxLife;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            drawBottleSprite(p.x + 12, p.y - 10, p.kind === 'softener', -1.08 + Math.sin(state.time * 18) * 0.05, 1.12);
        }

            const z = UI.leftZone;

                title = state.basket.type === 'dirty' ? 'DIRTY BASKET' : 'WET BASKET';
                pillCol = state.basket.type === 'dirty' ? PALETTE.amberPale : PALETTE.bluePale;
            } else if (canUnloadMachine(m)) {
                title = m.type === 'washer' ? 'WET BASKET' : 'CLEAN BASKET';

            const hint = getMachineHintMessage(m);
            const bx = z.x + z.w / 2;

            // Back rim of basket

        function drawMachineCenterZone(m) {

            const accentCol = isW ? PALETTE.washerAccent : PALETTE.dryerAccent;
            const drumCol = isW ? PALETTE.washerDrum : PALETTE.dryerDrum;
            const cue = getNextVisualCue(m);
            const pulse = 0.55 + Math.sin(state.time * 4.8) * 0.45;

            ctx.fillStyle = 'rgba(49, 64, 59, 0.16)';
            ctx.beginPath(); ctx.ellipse(r.x + r.w / 2, r.y + r.h + 4, r.w * 0.52, 12, 0, 0, Math.PI * 2); ctx.fill();

            fillRoundRect(r.x, r.y, r.w, r.h - 4, 18, bodyCol, PALETTE.ink, 3.2);
            ctx.fillStyle = topCol;
            ctx.fillRect(r.x + 6, r.y + 3, r.w - 12, 10);

            const panelH = 98;
            fillRoundRect(r.x + 3, r.y + 3, r.w - 6, panelH, 14, shadeCol);
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 2.8;
            ctx.beginPath(); ctx.moveTo(r.x + 1, r.y + panelH + 3); ctx.lineTo(r.x + r.w - 1, r.y + panelH + 3); ctx.stroke();

            if (!isW) {
                fillRoundRect(r.x + 16, r.y + 14, 122, 72, 9, PALETTE.cream, PALETTE.ink, 2.2);

                for (let s = 0; s < 4; s++) ctx.fillRect(r.x + 28, r.y + 24 + s * 9, 98, 4);

                ctx.font = '900 11px "Trebuchet MS", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(m.state === 'running' ? 'WARM AIR ON' : 'WARM AIR', r.x + 77, r.y + 72);
            }

            // LCD Status + LED + Progress Bar
            fillRoundRect(r.x + 148, r.y + 14, 96, 40, 7, '#d8eadf', PALETTE.ink, 2.2);
            let lcdText = 'EMPTY';
            if (m.state === 'loading') lcdText = isMachineReadyToStart(m) ? 'READY!' : 'LOADING';
            else if (m.state === 'running') lcdText = isW ? 'WASHING' : 'DRYING';
            else if (m.state === 'done') lcdText = 'DONE! ✓';

            ctx.fillStyle = '#2d4b3d';
            ctx.font = '900 13.5px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(lcdText, r.x + 196, r.y + 35);

            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 1.8;
            ctx.beginPath(); ctx.arc(r.x + 157, r.y + 72, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            fillRoundRect(r.x + 170, r.y + 64, 74, 16, 8, PALETTE.cream, PALETTE.ink, 1.8);
            const prog = m.state === 'done' ? 1 : m.progress;
            if (prog > 0.01) {
                fillRoundRect(r.x + 173, r.y + 67, Math.max(10, 68 * prog), 10, 5, m.state === 'done' ? '#62c48c' : (isW ? '#6ab8f0' : '#f0a25e'));
            }

            // Chunky START Button
            const sb = UI.startBtn;
            const ready = isMachineReadyToStart(m);
            if (ready) {
                ctx.save();
                ctx.globalAlpha = 0.45 * (0.75 + pulse * 0.25);
                fillRoundRect(sb.x - 5, sb.y - 5, sb.w + 10, sb.h + 10, 14, '#7ce0a6');
                ctx.restore();
            }

            const btnFill = ready
                ? (state.hoverTarget === 'start' ? '#7be0a5' : '#63cc90')
                : (m.state === 'running' ? '#a6d2ec' : '#d5dfdb');

            fillRoundRect(sb.x, sb.y, sb.w, sb.h, 12, btnFill, PALETTE.ink, 2.6);
            fillRoundRect(sb.x + 4, sb.y + 4, sb.w - 8, 14, 6, 'rgba(255, 255, 255, 0.32)');
            ctx.fillStyle = ready ? '#ffffff' : '#6b7d77';
            ctx.font = '900 17px "Trebuchet MS", sans-serif';
            ctx.fillText(m.state === 'running' ? 'ON' : 'START', sb.x + sb.w / 2, sb.y + sb.h / 2 + 2);

            // Drum & Direct-Tap Door
            const cx = UI.doorCenter.x, cy = UI.doorCenter.y;
            const outerR = UI.doorOuterR, innerR = UI.doorInnerR;

            ctx.fillStyle = shadeCol;
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(cx, cy, outerR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = drumCol;
            ctx.beginPath(); ctx.arc(cx, cy, innerR, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.6; ctx.stroke();

            ctx.save();
            ctx.beginPath(); ctx.arc(cx, cy, innerR - 2, 0, Math.PI * 2); ctx.clip();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(m.spinAngle);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 0, 54, 0, Math.PI * 2); ctx.stroke();

            for (let p = 0; p < 3; p++) {
                const a = (p * Math.PI * 2) / 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
                ctx.lineWidth = 9;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * 34, Math.sin(a) * 34);
                ctx.lineTo(Math.cos(a) * 78, Math.sin(a) * 78);
                ctx.stroke();
            }
            ctx.lineCap = 'butt';

            if (m.state === 'running' && m.items.length > 0) {
                for (let i = 0; i < m.items.length; i++) {
                    const a = (i * Math.PI * 2) / m.items.length + 0.5;
                    drawClothingItem(m.items[i], Math.cos(a) * 36, Math.sin(a) * 36, 0.80, false);
                }
            }
            ctx.restore();
            if (m.state !== 'running' && m.items.length > 0) {
                const slots = getDrumItemSlots(m.items.length);
                const drumScale = m.items.length >= 5 ? 0.72 : (m.items.length === 4 ? 0.80 : 0.90);
                for (let i = 0; i < m.items.length; i++) {
                    const s = slots[i];
                    if (m.doorOpen && canUnloadMachine(m)) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
                        ctx.beginPath(); ctx.arc(s.x, s.y, s.r - 2, 0, Math.PI * 2); ctx.fill();
                    }
                    drawClothingItem(m.items[i], s.x, s.y, drumScale, false);
                }
            }

            if (m.state === 'running') {
                if (isW) {
                    const waveY = cy + 16 + Math.sin(state.time * 4) * 5;
                    ctx.fillStyle = PALETTE.washerWater;
                    ctx.beginPath();
                    ctx.moveTo(cx - innerR, waveY);
                    ctx.quadraticCurveTo(cx - 44, waveY - 12, cx, waveY);
                    ctx.quadraticCurveTo(cx + 44, waveY + 12, cx + innerR, waveY);
                    ctx.lineTo(cx + innerR, cy + innerR); ctx.lineTo(cx - innerR, cy + innerR);
                    ctx.closePath();
                    ctx.fill();

                    for (let b = 0; b < 9; b++) {
                        const bx = cx - 56 + b * 15;
                        const by = cy + 68 - ((state.time * 42 + b * 23) % 130);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
                        ctx.strokeStyle = 'rgba(130, 198, 240, 0.85)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(bx + Math.sin(state.time * 3 + b) * 6, by, 5 + (b % 3) * 2.5, 0, Math.PI * 2);
                        ctx.fill(); ctx.stroke();
                    }
                } else {
                    const glow = 0.16 + Math.sin(state.time * 5) * 0.08;
                    ctx.fillStyle = `rgba(255, 206, 128, ${glow})`;
                    ctx.fillRect(cx - innerR, cy - innerR, innerR * 2, innerR * 2);
                    for (let s = 0; s < 6; s++) {
                        const a = state.time * 1.8 + (s * Math.PI * 2) / 6;
                        const sr = 36 + (s % 2) * 26;
                        drawSparkle(cx + Math.cos(a) * sr, cy + Math.sin(a) * sr, 9, '#fff5ba');
                    }
                }
            }

            if (state.drag.active && state.drag.kind === 'cloth' && state.drag.from === 'basket' && state.drag.overDrum) {
                ctx.fillStyle = 'rgba(134, 207, 166, 0.25)';
                ctx.fillRect(cx - innerR, cy - innerR, innerR * 2, innerR * 2);
                ctx.strokeStyle = '#9ef0c0';
                ctx.lineWidth = 5;
                ctx.setLineDash([10, 8]);
                ctx.beginPath(); ctx.arc(cx, cy, innerR - 10, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
            }
            ctx.restore();

            // Closed vs Swung-Open Door (Tap door directly!)
            if (!m.doorOpen) {
                ctx.fillStyle = 'rgba(218, 240, 252, 0.22)';
                ctx.beginPath(); ctx.arc(cx, cy, innerR, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = PALETTE.cream;
                ctx.lineWidth = 22;
                ctx.beginPath(); ctx.arc(cx, cy, innerR + 12, 0, Math.PI * 2); ctx.stroke();

                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(cx, cy, outerR - 4, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, innerR, 0, Math.PI * 2); ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                ctx.beginPath(); ctx.arc(cx, cy, innerR - 18, -2.5, -1.8); ctx.stroke();
                ctx.lineCap = 'butt';

                fillRoundRect(cx - outerR - 4, cy - 26, 14, 52, 5, accentCol, PALETTE.ink, 2.4);

                if (cue === 'openDoor') {
                    ctx.save();
                    ctx.globalAlpha = 0.55 + pulse * 0.4;
                    fillRoundRect(cx + outerR - 30, cy - 38, 38, 76, 14, PALETTE.cueGlow);
                    ctx.restore();
                }

                fillRoundRect(cx + outerR - 22, cy - 30, 22, 60, 8, accentCol, PALETTE.ink, 2.6);
                ctx.fillStyle = topCol;
                ctx.fillRect(cx + outerR - 15, cy - 18, 5, 36);
            } else {
                const hingeX = cx - outerR + 4;
                if (cue === 'closeDoor') {
                    ctx.save();
                    ctx.globalAlpha = 0.55 + pulse * 0.4;
                    ctx.fillStyle = PALETTE.cueGlow;
                    ctx.beginPath(); ctx.ellipse(hingeX - 20, cy, 32, outerR + 4, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }

                ctx.fillStyle = PALETTE.cream;
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.ellipse(hingeX - 20, cy, 24, outerR - 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                ctx.fillStyle = 'rgba(180, 220, 240, 0.55)';
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.ellipse(hingeX - 20, cy, 13, innerR - 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                fillRoundRect(hingeX - 6, cy - 26, 14, 52, 5, accentCol, PALETTE.ink, 2.4);
            }

            if (isW) drawWasherDispenserDrawer(m, cue, pulse);
        }

        function drawWasherDispenserDrawer(m, cue, pulse) {
            const anim = m.drawerAnim;
            const dx = 318;
            const dy = 92;
            const dw = 124 + anim * 28;
            const dh = 72 + anim * 56;

            if (cue === 'openDrawer' || cue === 'closeDrawer') {
                ctx.save();
                ctx.globalAlpha = 0.55 + pulse * 0.4;
                fillRoundRect(dx - 6, dy - 6, dw + 12, dh + 12, 13, PALETTE.cueGlow);
                ctx.restore();
            }

            if (anim > 0.05) {
                fillRoundRect(dx + 4, dy + 8, dw, dh, 10, `rgba(49, 64, 59, ${(0.22 * anim).toFixed(2)})`);
            }

            fillRoundRect(dx, dy, dw, dh, 9, PALETTE.cream, PALETTE.ink, 2.4);

            if (anim > 0.25) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, (anim - 0.2) / 0.5);

                const slotY = dy + 10;
                const slotH = dh - 40;
                const slotW = (dw - 22) / 2;

                // Left Blue Detergent Compartment
                const detGlow = state.drag.active && state.drag.overDetSlot;
                const detFill = m.hasDetergent ? '#89c7f0' : (detGlow ? '#cde9fa' : '#e6f2fa');
                fillRoundRect(dx + 8, slotY, slotW, slotH, 7, detFill, detGlow ? '#3a84bd' : PALETTE.washerAccent, detGlow ? 3 : 2);
                if (m.hasDetergent) {
                    ctx.fillStyle = 'rgba(255,255,255,0.45)';
                    ctx.fillRect(dx + 14, slotY + 10, slotW - 12, 6);
                }
                ctx.fillStyle = PALETTE.ink;
                ctx.font = '900 9.5px "Trebuchet MS", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('DETERGENT', dx + 8 + slotW / 2, slotY + slotH / 2 - 6);
                ctx.font = 'bold 10px "Trebuchet MS", sans-serif';
                ctx.fillStyle = m.hasDetergent ? '#1e5c8a' : PALETTE.inkSoft;
                ctx.fillText(m.hasDetergent ? '✓ FULL' : 'Pour here', dx + 8 + slotW / 2, slotY + slotH / 2 + 12);

                // Right Pink/Lavender Softener Compartment
                const sofX = dx + 14 + slotW;
                const sofGlow = state.drag.active && state.drag.overSofSlot;
                const sofFill = m.hasSoftener ? '#f4b5cb' : (sofGlow ? '#fbd3e2' : '#fbeaf0');
                fillRoundRect(sofX, slotY, slotW, slotH, 7, sofFill, sofGlow ? '#b8567b' : PALETTE.pinkMid, sofGlow ? 3 : 2);
                if (m.hasSoftener) {
                    ctx.fillStyle = 'rgba(255,255,255,0.45)';
                    ctx.fillRect(sofX + 6, slotY + 10, slotW - 12, 6);
                }
                ctx.fillStyle = PALETTE.ink;
                ctx.font = '900 9.5px "Trebuchet MS", sans-serif';
                ctx.fillText('SOFTENER', sofX + slotW / 2, slotY + slotH / 2 - 6);
                ctx.font = 'bold 10px "Trebuchet MS", sans-serif';
                ctx.fillStyle = m.hasSoftener ? '#8f3a5b' : PALETTE.inkSoft;
                ctx.fillText(m.hasSoftener ? '✓ FULL' : 'Pour here', sofX + slotW / 2, slotY + slotH / 2 + 12);

                ctx.restore();
            } else {
                ctx.fillStyle = PALETTE.ink;
                ctx.font = '900 11px "Trebuchet MS", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('SOAP DRAWER', dx + dw / 2, dy + 22);

                ctx.fillStyle = m.hasDetergent ? '#7cc0ee' : '#dce4e0';
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.arc(dx + dw / 2 - 14, dy + 38, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                ctx.fillStyle = m.hasSoftener ? '#f2a8c4' : '#dce4e0';
                ctx.beginPath(); ctx.arc(dx + dw / 2 + 14, dy + 38, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }

            // Drawer Pull Handle
            const handleY = dy + dh - 21;
            fillRoundRect(dx + dw / 2 - 34, handleY, 68, 14, 6, PALETTE.washerBody, PALETTE.ink, 1.8);
            ctx.fillStyle = PALETTE.washerAccent;
            ctx.fillRect(dx + dw / 2 - 18, handleY + 5, 36, 4);
        }

        function drawMachineRightZone(m) {
            const z = UI.rightZone;
            const isW = m.type === 'washer';
            const cue = getNextVisualCue(m);

            if (isW) {
                fillRoundRect(z.x, z.y, z.w, 148, 16, PALETTE.cream, PALETTE.ink, 2.2);
                fillRoundRect(z.x + 10, z.y + 104, z.w - 20, 12, 5, PALETTE.deskTop, PALETTE.ink, 1.8);

                const hidingDet = (state.drag.active && state.drag.kind === 'bottle' && state.drag.item === 'detergent') ||
                                  (state.pouring && state.pouring.kind === 'detergent');
                drawShelfBottleSlot(UI.detergentSlot, 'DETERGENT', m.hasDetergent, false, hidingDet, cue === 'pourDetergent');

                const hidingSof = (state.drag.active && state.drag.kind === 'bottle' && state.drag.item === 'softener') ||
                                  (state.pouring && state.pouring.kind === 'softener');
                drawShelfBottleSlot(UI.softenerSlot, 'SOFTENER', m.hasSoftener, true, hidingSof, cue === 'pourSoftener');

                drawChecklistCard(m, z.x, 236, z.w, 282);
            } else {
                fillRoundRect(z.x, z.y, z.w, 134, 16, PALETTE.cream, PALETTE.ink, 2.4);
                fillRoundRect(z.x + 48, z.y + 72, 168, 28, 10, '#f7cfc2', PALETTE.ink, 2.2);
                fillRoundRect(z.x + 60, z.y + 48, 144, 26, 10, '#cde8d8', PALETTE.ink, 2.2);
                fillRoundRect(z.x + 74, z.y + 26, 116, 24, 9, '#fcf0c7', PALETTE.ink, 2.2);
                ctx.fillStyle = PALETTE.inkSoft;
                ctx.font = 'bold 13px "Trebuchet MS", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Warm & Fluffy Drying!', z.x + z.w / 2, z.y + 116);

                drawChecklistCard(m, z.x, 224, z.w, 294);
            }
        }

        function drawShelfBottleSlot(rect, label, added, isSoftener, isHidden, shouldCue) {
            const cx = rect.x + rect.w / 2;
            const cy = rect.y + 56;

            if (shouldCue && !added && !isHidden) {
                ctx.save();
                ctx.globalAlpha = 0.45 + Math.sin(state.time * 4.8) * 0.35;
                fillRoundRect(rect.x + 6, rect.y + 4, rect.w - 12, 96, 12, PALETTE.cueGlow);
                ctx.restore();
            }

            if (!isHidden) {
                ctx.save();
                if (added) ctx.globalAlpha = 0.55;
                drawBottleSprite(cx, cy, isSoftener, 0, 0.92);
                ctx.restore();
            }

            ctx.fillStyle = PALETTE.ink;
            ctx.font = '900 12px "Trebuchet MS", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, cx, rect.y + 118);

            ctx.fillStyle = added ? '#2d7a4f' : PALETTE.inkSoft;
            ctx.font = 'bold 10.5px "Trebuchet MS", sans-serif';
            ctx.fillText(added ? '✓ POURED' : 'Drag to drawer', cx, rect.y + 132);
        }

        function drawChecklistCard(m, x, y, w, h) {
            fillRoundRect(x, y, w, h, 16, PALETTE.cream, PALETTE.ink, 2.4);

            fillRoundRect(x + 18, y + 10, w - 36, 28, 9, PALETTE.creamShade, PALETTE.ink, 1.8);
            ctx.fillStyle = PALETTE.ink;
            ctx.font = '900 13.5px "Trebuchet MS", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('STEPS TO DO', x + w / 2, y + 25);

            const isW = m.type === 'washer';
            const total = m.expectedCount > 0 ? m.expectedCount : (state.basket ? state.basket.totalCount : 3);
            let steps = [];

            if (m.state === 'done') {
                const unloaded = total - m.items.length;
                steps = [
                    { text: '1. Tap door to open', done: m.doorOpen },
                    { text: isW ? `2. Drag wet clothes (${unloaded}/${total})` : `2. Drag dry clothes (${unloaded}/${total})`, done: unloaded === total }
                ];
            } else {
                const loaded = m.items.length;
                const clothesIn = allClothesLoaded(m);
                const isRunning = m.state === 'running';
                if (isW) {
                    steps = [
                        { text: `1. Put clothes in (${loaded}/${total})`, done: clothesIn || isRunning },
                        { text: '2. Pour Detergent', done: m.hasDetergent || isRunning },
                        { text: '3. Pour Softener', done: m.hasSoftener || isRunning },
                        { text: '4. Shut soap drawer', done: (!m.drawerOpen && m.hasDetergent && m.hasSoftener) || isRunning },
                        { text: '5. Shut machine door', done: (!m.doorOpen && clothesIn) || isRunning },
                        { text: '6. Press START', done: isRunning }
                    ];
                } else {
                    steps = [
                        { text: `1. Put wet clothes in (${loaded}/${total})`, done: clothesIn || isRunning },
                        { text: '2. Shut machine door', done: (!m.doorOpen && clothesIn) || isRunning },
                        { text: '3. Press START', done: isRunning }
                    ];
                }
            }

            const firstTodoIdx = steps.findIndex(s => !s.done);
            const rowH = steps.length > 4 ? 38 : 54;
            const startY = y + 48;

            steps.forEach((step, i) => {
                const ry = startY + i * rowH;
                if (i === firstTodoIdx) {
                    const pulseBg = state.nudgeTimer > 0 ? '#fce7a7' : '#eef7f2';
                    fillRoundRect(x + 10, ry - 3, w - 20, rowH - 5, 8, pulseBg, state.nudgeTimer > 0 ? PALETTE.amberBorder : '#b9d8c9', 1.6);
                }

                const checkX = x + 26;
                const checkY = ry + (rowH - 12) / 2;
                ctx.fillStyle = step.done ? PALETTE.greenSoft : '#ffffff';
                ctx.strokeStyle = step.done ? PALETTE.greenMid : PALETTE.inkSoft;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(checkX, checkY, 9.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                if (step.done) {
                    ctx.strokeStyle = PALETTE.ink;
                    ctx.lineWidth = 2.4;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(checkX - 4, checkY);
                    ctx.lineTo(checkX - 1, checkY + 3.8);
                    ctx.lineTo(checkX + 4.8, checkY - 3.8);
                    ctx.stroke();
                    ctx.lineCap = 'butt';
                }

                ctx.fillStyle = step.done ? PALETTE.inkSoft : PALETTE.ink;
                ctx.font = step.done ? 'bold 12.5px "Trebuchet MS", sans-serif' : '900 13px "Trebuchet MS", sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(step.text, x + 43, checkY + 1);
            });
        }
        /* =========================================================================
         * LEVEL COMPLETE & ALL LEVELS COMPLETE OVERLAY
         * ========================================================================= */
function drawLevelCompleteOverlay() {
            if (!state.levelCompleteOverlay) return;

            const isAll = state.levelCompleteOverlay === 'all';
            const t = state.time;

            if (!isAll) {
                // Dimmed backdrop
                ctx.fillStyle = 'rgba(37, 48, 54, 0.55)';
                ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

                const cx = 160, cy = 62, cw = 640, ch = 416;
                fillRoundRect(cx + 5, cy + 7, cw, ch, 24, 'rgba(24, 34, 38, 0.28)');
                fillRoundRect(cx, cy, cw, ch, 24, PALETTE.cream, PALETTE.ink, 3.5);
                fillRoundRect(cx + 10, cy + 10, cw - 20, ch - 20, 18, null, PALETTE.wallBanner, 2);

                // Title
                ctx.fillStyle = PALETTE.ink;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '900 32px "Trebuchet MS", sans-serif';
                ctx.fillText(`Level ${state.level} Complete!`, LOGICAL_W / 2, cy + 46);

                ctx.fillStyle = PALETTE.inkSoft;
                ctx.font = 'bold 19px "Trebuchet MS", sans-serif';
                ctx.fillText('Well done, Patrick!', LOGICAL_W / 2, cy + 78);

                // Cosy Dance Stage
                const sx = 220, sy = 160, sw = 520, sh = 192;
                fillRoundRect(sx, sy, sw, sh, 16, '#e8f3ee', PALETTE.ink, 2.5);
                ctx.fillStyle = '#d8eae1';
                ctx.fillRect(sx + 2, sy + sh - 46, sw - 4, 44);
                ctx.strokeStyle = PALETTE.wallBanner;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(sx + 2, sy + sh - 46);
                ctx.lineTo(sx + sw - 2, sy + sh - 46);
                ctx.stroke();

                // Pastel bunting along the top of the stage
                const flagCols = ['#f2b7cc', '#fae08c', '#9ac4e2', '#98ccb0', '#c7b8e6'];
                for (let f = 0; f < 10; f++) {
                    const fx = sx + 22 + f * 48;
                    ctx.fillStyle = flagCols[f % flagCols.length];
                    ctx.strokeStyle = PALETTE.ink;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(fx, sy + 2);
                    ctx.lineTo(fx + 36, sy + 2);
                    ctx.lineTo(fx + 18, sy + 24);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                // Dance rhythm
                const beat = Math.sin(t * 5.2);
                const hop = Math.abs(beat) * 14;
                const tilt = beat * 0.12;

                // --- DANCING PATRICK (left side of stage) ---
                const px = 392, py = 316;
                ctx.fillStyle = 'rgba(49, 64, 59, 0.16)';
                ctx.beginPath();
                ctx.ellipse(px, py + 4, 24 - hop * 0.4, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(px, py - hop);
                ctx.rotate(-tilt * 0.7);

                // Legs kicking happily
                ctx.fillStyle = PALETTE.trousers;
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 2.4;
                fillRoundRect(-14, -22, 11, 22, 4, PALETTE.trousers, PALETTE.ink, 2.2);
                fillRoundRect(3, -22, 11, 22, 4, PALETTE.trousers, PALETTE.ink, 2.2);
                fillRoundRect(-16, -5, 14, 8, 3, PALETTE.shoes, PALETTE.ink, 2);
                fillRoundRect(2, -5, 14, 8, 3, PALETTE.shoes, PALETTE.ink, 2);

                // Shirt
                fillRoundRect(-18, -54, 36, 34, 9, PALETTE.shirt, PALETTE.ink, 2.4);

                // Waving arms
                ctx.save();
                ctx.translate(-17, -46);
                ctx.rotate(-0.8 + beat * 0.65);
                fillRoundRect(-6, -24, 11, 26, 5, PALETTE.shirt, PALETTE.ink, 2.2);
                ctx.fillStyle = PALETTE.skin;
                ctx.beginPath(); ctx.arc(0, -24, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.restore();

                ctx.save();

         /* =========================================================================

        function drawTitleLaundrettePicture(x, y, w, h) {
            // Retro gold & cream SNES picture frame
            fillRoundRect(x - 8, y - 8, w + 16, h + 16, 14, '#fae08c', '#31403b', 3);
            fillRoundRect(x - 3, y - 3, w + 6, h + 6, 10, '#31403b');

            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.clip();

            // Pastel sky & gentle drifting clouds
            ctx.fillStyle = '#d4edf9';
            ctx.fillRect(x, y, w, h);

            const drawCloud = (cx, cy, s) => {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(cx, cy, 14 * s, 0, Math.PI * 2);
                ctx.arc(cx + 15 * s, cy - 4 * s, 16 * s, 0, Math.PI * 2);
                ctx.arc(cx + 31 * s, cy, 13 * s, 0, Math.PI * 2);
                ctx.fill();
            };
            const cDrift = (state.time * 8) % (w + 120);
            drawCloud(x + ((40 + cDrift) % (w + 100)) - 50, y + 32, 0.9);
            drawCloud(x + ((250 + cDrift * 0.7) % (w + 100)) - 50, y + 24, 0.75);

            // Cosy street ground inside the picture
            ctx.fillStyle = '#d8d0c0';
            ctx.fillRect(x, y + h - 36, w, 36);
            ctx.fillStyle = '#b9afa0';
            ctx.fillRect(x, y + h - 36, w, 4);

            // Laundrette Shopfront Building
            const bx = x + 44, by = y + 48, bw = w - 88, bh = h - 84;
            fillRoundRect(bx, by, bw, bh, 6, PALETTE.wallCream, PALETTE.ink, 2.8);

            // Roof trim & Signboard
            fillRoundRect(bx - 6, by - 10, bw + 12, 16, 5, PALETTE.wallBannerDark, PALETTE.ink, 2.4);
            fillRoundRect(bx + 54, by - 26, bw - 108, 24, 6, PALETTE.cream, PALETTE.ink, 2.4);
            ctx.fillStyle = PALETTE.ink;
            ctx.font = '900 13px "Trebuchet MS", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("PATRICK'S LAUNDRETTE", bx + bw / 2, by - 13);

            // Striped Pastel Awning
            const awY = by + 8;
            const stripes = 9;
            const sw = (bw + 8) / stripes;
            for (let i = 0; i < stripes; i++) {
                ctx.fillStyle = i % 2 === 0 ? PALETTE.greenSoft : PALETTE.cream;
                ctx.fillRect(bx - 4 + i * sw, awY, sw + 0.5, 22);
                ctx.beginPath();
                ctx.arc(bx - 4 + i * sw + sw / 2, awY + 22, sw / 2, 0, Math.PI);
                ctx.fill();
            }
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 2.2;
            ctx.strokeRect(bx - 4, awY, bw + 8, 22);

            // Wooden Shop Door (left) + OPEN sign
            const dx = bx + 20, dy = by + 44, dw = 68, dh = bh - 44;
            fillRoundRect(dx, dy, dw, dh, 4, PALETTE.deskMain, PALETTE.ink, 2.4);
            fillRoundRect(dx + 9, dy + 10, dw - 18, 46, 3, '#cde8f6', PALETTE.ink, 2);
            fillRoundRect(dx + 16, dy + 24, dw - 32, 18, 4, PALETTE.greenPale, PALETTE.ink, 1.5);
            ctx.fillStyle = PALETTE.ink;
            ctx.font = '900 10px "Trebuchet MS", sans-serif';
            ctx.fillText('OPEN', dx + dw / 2, dy + 34);
            ctx.fillStyle = PALETTE.bellGold;
            ctx.beginPath(); ctx.arc(dx + dw - 11, dy + 68, 4, 0, Math.PI * 2); ctx.fill();

            // Big Glowing Shopfront Window (right) with 3 little washers inside
            const wx = bx + 104, wy = by + 44, ww = bw - 122, wh = 82;
            fillRoundRect(wx, wy, ww, wh, 6, '#e8f6fc', PALETTE.ink, 2.4);

            for (let m = 0; m < 3; m++) {
                const mx = wx + 14 + m * 64;
                const my = wy + 22;
                fillRoundRect(mx, my, 52, 56, 5, PALETTE.washerBody, PALETTE.ink, 2);
                ctx.fillStyle = PALETTE.washerDrum;
                ctx.beginPath(); ctx.arc(mx + 26, my + 34, 15, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = PALETTE.cream;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(mx + 26, my + 34, 15, 0, Math.PI * 2); ctx.stroke();

                // Gentle spinning bubble inside each window washer
                const a = state.time * 3 + m * 2;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(mx + 26 + Math.cos(a) * 6, my + 34 + Math.sin(a) * 6, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Window shine lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(wx + 12, wy + 26); ctx.lineTo(wx + 32, wy + 8);
            ctx.moveTo(wx + 24, wy + 30); ctx.lineTo(wx + 44, wy + 12);
            ctx.stroke();

             // "DOGS WELCOME" sign with a tiny paw print at the top of the window
            const swX = wx + (ww - 134) / 2;
            const swY = wy + 3;
            fillRoundRect(swX, swY, 134, 17, 4, PALETTE.amberPale, PALETTE.ink, 1.5);

            // Tiny paw print on the left of the sign
            ctx.fillStyle = PALETTE.ink;
            ctx.beginPath();
            ctx.arc(swX + 14, swY + 10.5, 2.5, 0, Math.PI * 2);
            ctx.arc(swX + 10.5, swY + 6.8, 1.3, 0, Math.PI * 2);
            ctx.arc(swX + 14,   swY + 5.6, 1.3, 0, Math.PI * 2);
            ctx.arc(swX + 17.5, swY + 6.8, 1.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = PALETTE.ink;
            ctx.font = '900 9.5px "Trebuchet MS", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('DOGS WELCOME', swX + 76, swY + 9);

            // Potted plant outside the door
            ctx.save();
            ctx.translate(bx - 16, by + bh - 12);
            ctx.scale(0.85, 0.85);
            drawPottedPlant(0, 0);
            ctx.restore();

            ctx.restore();
        }

            const px = patrickX - 66;

            ctx.font = '900 46px "Trebuchet MS", sans-serif';
            ctx.fillStyle = '#4e7e99';
            ctx.fillText("PATRICK'S LAUNDRETTE", LOGICAL_W / 2 + 4, 54);
            ctx.fillStyle = '#fae08c';
            ctx.fillText("PATRICK'S LAUNDRETTE", LOGICAL_W / 2, 50);

            // Twinkling retro stars flanking the title
            const tw = 0.8 + Math.sin(state.time * 3.5) * 0.25;
            drawSparkle(148, 48, 11 * tw, '#fae08c');
            drawSparkle(812, 48, 11 * tw, '#fae08c');

            // Framed Retro Laundrette Picture
            drawTitleLaundrettePicture(270, 96, 420, 228);

            // Chunky START GAME button
            const b = UI.startGameBtn;
            const hover = state.hoverTarget === 'startGame';
            const pulse = 0.4 + Math.sin(state.time * 4.5) * 0.25;

            ctx.save();
            ctx.globalAlpha = pulse;
            fillRoundRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12, 18, '#86cfa6');
            ctx.restore();

            fillRoundRect(b.x, b.y, b.w, b.h, 14, hover ? '#7be0a5' : '#5ec78b', '#ffffff', 3);
            fillRoundRect(b.x + 6, b.y + 5, b.w - 12, 14, 7, 'rgba(255, 255, 255, 0.28)');

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 24px "Trebuchet MS", sans-serif';
            ctx.fillText('▶  START GAME', b.x + b.w / 2, b.y + b.h / 2 + 2);

            // Patrick & Popeye walking left-to-right across the black underneath
            const walkX = ((state.time * 88) % (LOGICAL_W + 240)) - 80;
            drawTitleWalkingPair(walkX, 514);
        }

        /* =========================================================================
         * MAIN RENDER & ANIMATION LOOP
         * ========================================================================= */
        function render() {
            ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

            if (state.scene === 'title') drawTitleScene();
            else if (state.scene === 'topdown') drawTopDownScene();
            else if (state.scene === 'popeye') drawPopeyeCloseUpScene();
            else if (state.scene === 'machine') drawMachineCloseUpScene();


            drawLevelCompleteOverlay();

            if (state.transition.active && state.transition.alpha > 0.01) {
                ctx.fillStyle = `rgba(37, 48, 54, ${state.transition.alpha.toFixed(3)})`;
                ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
            }
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
            lastTime = timestamp;

            update(dt);
            render();
            requestAnimationFrame(gameLoop);
        }
        window.onload = function () {
            state.scene = 'title';
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
